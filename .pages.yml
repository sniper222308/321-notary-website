  - name: services
    label: Services
    type: file
    path: src/data/services.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: services
        label: Services
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - name: title
            label: Service name
            type: string
            required: true
          - name: description
            label: Short description
            type: text
            required: true
  - name: about
    label: About
    type: file
    path: src/data/about.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: text
        label: About Alena
        type: text
        required: true
      - name: photo
        label: Owner photograph
        type: image
        description: Optional. Leave empty to show the existing business badge.
  - name: faqs
    label: Frequently Asked Questions
    type: file
    path: src/data/faqs.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: items
        label: Questions and answers
        type: object
        description: Add, remove, or drag questions to reorder them. The words in braces insert current business information automatically; keep them where useful.
        list:
          collapsible:
            summary: "{question}"
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
            description: Use {hours}, {address}, {phone}, or {email} to insert current information automatically.
  - name: photos
    label: Photos
    type: file
    path: src/data/photos.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: hero
        label: Kinzua Reservoir hero photograph
        type: image
        required: true
        description: Choose a wide landscape image of Kinzua Reservoir.
  - name: announcement
    label: Announcements
    type: file
    path: src/data/announcement.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: enabled
        label: Show announcement
        type: boolean
      - name: message
        label: Announcement message
        type: text
        description: A short notice, such as a temporary closure. Turn on the switch above to show it.
