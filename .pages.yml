media:
  input: public/uploads
  output: /uploads
  categories: [image]
  rename: safe
settings:
  hide: true
content:
  - name: business
    label: Business Information
    type: file
    path: src/data/business.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: name
        label: Business name
        type: string
        required: true
      - name: address
        label: Street address
        type: string
        required: true
      - name: city
        label: City
        type: string
        required: true
      - name: state
        label: State
        type: string
        required: true
      - name: zip
        label: ZIP code
        type: string
        required: true
      - name: phone
        label: Phone number
        type: string
        required: true
      - name: email
        label: Email address
        type: string
        required: true
      - name: appointment
        label: Appointment instructions
        type: string
        required: true
  - name: hours
    label: Business Hours
    type: file
    path: src/data/hours.json
    format: json
    operations: { delete: false, rename: false }
    fields:
      - name: monday
        label: Monday
        type: object
        fields:
          - name: closed
            label: Closed
            type: boolean
          - name: opens
            label: Opening time
            type: string
            required: true
            description: Use 24-hour time, for example 09:00 or 17:30. Keep a time here even when closed.
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          - name: closes
            label: Closing time
            type: string
            required: true
            description: Use 24-hour time, for example 09:00 or 17:30.
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      - name: tuesday
